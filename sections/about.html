<div
    class="about-book-overlay"
    id="about-book-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="about-book-title"
    aria-describedby="about-book-text"
    hidden
  >
    <article class="about-book">
      <button
        type="button"
        class="about-book-close"
        id="about-book-close"
        aria-label="Close About Me book"
      >
        ×
      </button>

      <div class="about-book-page about-book-page-left">
        <img
          class="about-book-star"
          src="images/favicon_star.PNG"
          alt=""
        >
        <span class="about-book-page-number" id="about-book-page-number">
          Fun Fact 1 of 5
        </span>
      </div>

      <div class="about-book-page about-book-page-right">
        <div
          class="about-book-tabs"
          role="tablist"
          aria-label="About Me book pages"
        >

          <button class="about-book-tab" id="about-book-tab-2" type="button" role="tab" data-story="1" aria-controls="about-book-story-panel" aria-selected="false" tabindex="-1">2</button>
