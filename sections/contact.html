<div
    class="contact-envelope-overlay"
    id="contact-envelope-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="contact-envelope-title"
    aria-describedby="contact-envelope-text"
    hidden
  >
    <article class="contact-envelope">
      <span class="contact-envelope-flap" aria-hidden="true"></span>
      <span class="contact-envelope-pocket" aria-hidden="true"></span>

      <button
        type="button"
        class="contact-envelope-close"
        id="contact-envelope-close"
        aria-label="Close contact envelope"
      >
        ×
      </button>

      <div class="contact-envelope-letter">
        <img
          class="contact-envelope-stamp"
          src="images/favicon_star.PNG"
          alt=""
        >

        <h3 class="contact-envelope-title" id="contact-envelope-title">
          Let's Connect!
        </h3>

        <p class="contact-envelope-text" id="contact-envelope-text">
          I'd love to hear from you! Reach out through any of the links below.
        </p>

        <ul class="contact-links">
          <li>
            <a href="mailto:grace@example.com">
              ✉️ grace@example.com
            </a>
          </li>

          <li>
            <a href="https://www.linkedin.com/in/example" target="_blank" rel="noopener">
              🔗 LinkedIn
            </a>
          </li>

          <li>
            <a href="https://github.com/example" target="_blank" rel="noopener">
              💻 GitHub
            </a>
          </li>
        </ul>
      </div>
    </article>
  </div>
